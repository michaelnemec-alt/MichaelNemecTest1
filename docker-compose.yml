services:
  app:
    build: .
    image: autostore-analytics:latest
    container_name: autostore-analytics
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      # Provided via a .env file next to this compose file (git-ignored).
      CUBEANALYTICS_TOKEN: ${CUBEANALYTICS_TOKEN:?set CUBEANALYTICS_TOKEN in .env}
      # Optional — only needed for the Snowflake-backed pages.
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      # Peak-memory guard: max concurrent (site × endpoint) fetches. Lower it on
      # a RAM-constrained NAS; raise it for speed on a bigger box.
      CUBE_MAX_CONCURRENT_FETCHES: ${CUBE_MAX_CONCURRENT_FETCHES:-4}
      # Where the app reads the collector's raw NDJSON store (read-only mount
      # below). Enables WebSocket-only event types (e.g. CHARGER_STATE) on the
      # Live data page.
      RAW_EVENTS_DIR: /collector-data
    volumes:
      # Persist the on-disk @st.cache_data across restarts (Streamlit writes its
      # disk cache under $HOME/.streamlit, i.e. /root/.streamlit in the image).
      - autostore-cache:/root/.streamlit
      # Read-only view of the collector's raw store (see the collector service).
      - autostore-raw:/collector-data:ro
    mem_limit: 3g

  # Raw live-event collector: streams the WebSocket and backfills the REST
  # window into an append-only NDJSON store. Reuses the app image but runs the
  # collector module instead of Streamlit.
  collector:
    build: .
    image: autostore-analytics:latest
    container_name: autostore-collector
    restart: unless-stopped
    entrypoint: ["python", "-m", "collector.collect"]
    environment:
      CUBEANALYTICS_TOKEN: ${CUBEANALYTICS_TOKEN:?set CUBEANALYTICS_TOKEN in .env}
      COLLECTOR_DATA_ROOT: /data
      # Optional: comma-separated installation ids (default: all the token sees).
      COLLECTOR_INSTALLATIONS: ${COLLECTOR_INSTALLATIONS:-}
      COLLECTOR_BACKFILL_HOURS: ${COLLECTOR_BACKFILL_HOURS:-48}
    volumes:
      # Raw NDJSON store. Swap for a bind mount (e.g. /share/Container/autostore-raw:/data)
      # to browse the files directly on the NAS.
      - autostore-raw:/data
    mem_limit: 512m

volumes:
  autostore-cache:
  autostore-raw:
